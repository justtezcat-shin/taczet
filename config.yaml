    # cote API. Sur un serveur prive d une seule personne, ils n ont plus
    # d objet. Le verrou taczet-approval-gate reste en place par securite.

  whatsapp:
    # Aligne sur Discord le 2026-08-26. Le prereglage d'origine
    # `hermes-whatsapp` donnait 59 outils, dont 51 que le verrou ne voit

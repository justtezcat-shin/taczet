# ── Reglages Discord ──────────────────────────────────────────────────
# ATTENTION : ce bloc est TOP-LEVEL, volontairement HORS de `platforms:`.
# C'est l'emplacement lu par le pont YAML->env (discord/adapter.py:9999).
# Une clef posee sous `platforms.discord` ici serait ignoree en silence.
discord:
  # Depuis le 2026-08-25, Isaac parle a TACZET en MESSAGE PRIVE. En DM,
  # l'adaptateur saute tout ce bloc de controle de salon (adapter.py:7710) :
  # require_mention, thread_require_mention, free_response_channels et
  # ignore_no_mention y sont donc SANS EFFET. Ils sont conserves parce
  # qu'ils reprennent effet si un salon est utilise a nouveau. En revanche
  # auto_thread et reactions agissent, eux, dans les deux cas.
  #
  # false = TACZET ne cree plus de fil et repond dans le salon courant.
  # Defaut amont = true (adapter.py:7766, os.getenv("DISCORD_AUTO_THREAD","true")).
  # Le pont n'ecrase pas la variable si .env la definit — elle n'y est pas.
  auto_thread: false

  # ── Mode silencieux, demande d'Isaac le 2026-08-12 ──────────────────
  # TACZET ne parle QUE si on l'interpelle.
  # Deja le defaut amont, pose explicitement pour ne dependre d'aucun defaut.
  require_mention: true
  # Exige la mention MEME dans un fil. Sans ca, tout fil ou TACZET a deja
  # parle devient un salon ou il repond a tout (adapter.py:7749).
  thread_require_mention: true
  # Vide = aucun salon exempte de mention. Un ID ici rouvrirait la vanne.
  free_response_channels: ""
  # Silence si un autre utilisateur est mentionne mais pas TACZET.
  ignore_no_mention: true
  # Retire les reactions emoji (regard, coche, croix) posees sur les messages
  # pendant le traitement — le "cote interactif" qu'Isaac veut supprimer.
  reactions: false

platforms:
  discord:
    enabled: true
    # Point d'attache : la ou TACZET ecrit DE LUI-MEME (taches planifiees de
    # la Phase C, notifications). Pointait jusqu'au 2026-08-25 sur un salon
    # du serveur « <SERVEUR-PARTAGE> », quitte depuis — les envois spontanes seraient
    # partis dans le vide. C'est desormais la conversation privee d'Isaac.
    home_channel:
      platform: discord
      chat_id: '<ID-CONVERSATION-PRIVEE>'
      name: 'DM Isaac'
      # thread_id retire le 2026-08-12 : le fil <ID> a ete
      # supprime cote Discord et renvoyait 404 Unknown Channel a chaque envoi
      # spontane. Sans fil, TACZET poste directement dans le salon — coherent
      # avec auto_thread: false. Ne pas le remettre.
      user_id: '<ID-UTILISATEUR-DISCORD>'
      # scope_id VOLONTAIREMENT ABSENT. Il cadre la livraison sur un serveur
      # (gateway/delivery.py:551) ; un message prive n'appartient a aucun
      # serveur. Le champ est Optional et n'est ajoute aux metadonnees que
      # s'il est renseigne (gateway/config.py:507) : l'omettre est la forme
      # correcte, pas un oubli. Ne pas y remettre l'ancien identifiant.
    # ── Menu des commandes slash (2026-08-12) ─────────────────────────
    # false = les 28 commandes disparaissent du menu Discord (adapter.py:1113,
    # booleen global : aucun filtrage individuel n'existe dans Hermes).
    # RIEN N'EST PERDU : toute commande reste utilisable en la TAPANT en texte
    # — le gateway detecte les messages commencant par "/" (base.py:2379) et
    # les route hors du chemin de l'agent (run.py:26674).
    # Essentielles a retenir : /stop  /new  /sethome  /status
    slash_commands: false
    # `tool_progress` a ete retire d'ici : cet emplacement n'est JAMAIS lu
    # (resolve_display_setting, display_config.py:213). Le reglage effectif
    # vit desormais sous display.platforms.discord.
  whatsapp:
    enabled: true
    # Coupe les avis « Gateway shutting down / online » sur WhatsApp
    # (2026-08-26). Ils partent par DEUX chemins, tous deux gardes par cette
    # meme clef : les sessions actives (run.py:9696) et le salon d'attache
    # (run.py:9785).
    #
    # WhatsApp est le fil d'Isaac avec lui-meme : un avis d'exploitation y est
    # du bruit pur. Volontairement LAISSE ACTIF sur Discord, ou il apprend
    # quelque chose d'utile — qu'un redemarrage a interrompu une demande en
    # cours.
    gateway_restart_notification: false
    # Couche 2 (runner) : aucune reponse aux non-autorises, jamais de code d'appairage.
    unauthorized_dm_behavior: ignore
    # Couche 1 (adaptateur) : un inconnu est rejete AVANT l'intake du gateway.
    # NB: ne jamais definir allow_from ici — une cle presente (meme vide) prime
    # sur WHATSAPP_ALLOWED_USERS et couperait Isaac lui-meme.
    dm_policy: allowlist
    group_policy: disabled

# ── Dashboard web ─────────────────────────────────────────────────────
# Theme sur mesure defini dans dashboard-themes/taczet.yaml (dossier
# utilisateur : survit aux `hermes update`). Le selecteur de palette du
# dashboard reecrit cette clef quand tu changes de theme a la souris.
dashboard:
  theme: taczet

# ── Verrou d'approbation TACZET (BLUEPRINT §4) ────────────────────────
# Refuse les actions Discord irreversibles avant execution. Approuve par
# Isaac le 2026-08-12. Script : hooks/taczet-approval-gate.py
#
# `matcher` est un regex fullmatch sur le nom de l'outil : le hook ne se
# declenche QUE sur discord_admin. C'est ce qui rend `fail_closed: true`
# sur : un plantage du script bloque cet outil seul, pas tout TACZET.
#
# Deblocage = jeton a usage unique depose depuis le TERMINAL dans
# hooks/taczet-approval-token.json. Jamais depuis Discord.
# ── Livraison des taches planifiees (2026-08-26) ────────────────────
# false = le contenu est livre nu. Le defaut amont enveloppe chaque reponse
# de « Cronjob Response: <nom> », de l identifiant du job, d un separateur,
# et d un pied de page.
#
# Ce pied de page est de surcroit DEVENU FAUX le 25/08 : il invite a ecrire
# « stop reminder <nom> » a TACZET, alors que le CLI `hermes` est passe dans
# le noyau — TACZET ne peut plus gerer les taches, Isaac le fait au terminal.
# Une consigne qui envoie l utilisateur dans le mur vaut moins que rien.
#
# Contrepartie assumee : le nom de la tache disparait du message. Les deux
# rappels de 20 h portent le meme contenu sur deux plateformes, et le texte
# se suffit a lui-meme.
cron:
  wrap_response: false

hooks:
  pre_tool_call:
    - matcher: "discord_admin"
      command: '"C:\Users\<UTILISATEUR>\AppData\Local\hermes\hermes-agent\venv\Scripts\python.exe"
        "C:\Users\<UTILISATEUR>\AppData\Local\hermes\hooks\taczet-approval-gate.py"'
      timeout: 10
      fail_closed: true

    # ── Verrou de controle machine — approuve par Isaac le 2026-08-13 ──
    # Fenetre d'autorisation ouverte depuis le TERMINAL :
    #   powershell -File %LOCALAPPDATA%\hermes\hooks\taczet-control.ps1 open 15
    # Hors fenetre : shell, ecriture fichier, execution de code et pilotage du
    # bureau sont refuses. Les actions de LECTURE de computer_use (capture,
    # list_apps, list_windows) restent libres — alignees sur _SAFE_ACTIONS
    # d'Hermes (tools/computer_use/tool.py:81).
    # Necessaire car sans callback CLI, l'approbation native de computer_use
    # renvoie "autorise" par defaut sur le gateway (tool.py:534).
    # read_file et search_files sont dans le matcher UNIQUEMENT pour que le
    # noyau protege (.env, config.yaml, SOUL.md, hooks/) soit inaccessible en
    # lecture. Toute autre lecture est autorisee immediatement par le script.
    # `skill_manage` ajoute le 2026-08-26, a l issue de l audit des outils que
    # le verrou ne voyait pas. Une skill est du TEXTE QUE LE MODELE LIT ET
    # SUIT : en ecrire une revient a se donner des consignes permanentes,
    # fonctionnellement un amendement a SOUL.md — lequel est dans le noyau
    # precisement pour empecher ca. Et SOUL.md ligne 64 dit « Reactif, jamais
    # a l initiative » : s ecrire des consignes durables EST une initiative.
    #
    # Hermes laisse pourtant son propre garde-fou (skills.guard_agent_created)
    # desactive, et sa raison est explicite dans le code : « the agent can
    # already execute the same code paths via terminal() with no gate ». Cette
    # hypothese est FAUSSE ici — terminal() est verrouille depuis le 13/08.
    # Un defaut amont justifie par une hypothese que notre configuration
    # invalide.
    - matcher: "terminal|process|write_file|patch|execute_code|computer_use|read_file|search_files|skill_manage"
      command: '"C:\Users\<UTILISATEUR>\AppData\Local\hermes\hermes-agent\venv\Scripts\python.exe"
        "C:\Users\<UTILISATEUR>\AppData\Local\hermes\hooks\taczet-control-gate.py"'
      timeout: 10
      fail_closed: true

# Le gateway tourne en non-TTY : sans ceci, le prompt de consentement ne
# peut pas s'afficher, le hook ne s'enregistre pas, et le verrou serait
# SILENCIEUSEMENT INACTIF. Verifier apres redemarrage avec `hermes hooks list`.
hooks_auto_accept: true

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
approvals:
  destructive_slash_confirm: false

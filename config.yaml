  telegram:
    - hermes-telegram
  # ── Discord allege le 2026-08-22 ────────────────────────────────────
  # Le preset hermes-discord exposait 25 outils, 63 692 B de schemas
  # retraites a CHAQUE requete. Liste explicite de ce dont Isaac se sert.
  # Retires : session_search, delegation, browser (dependances absentes,
  # ne fonctionne pas), code_execution, tts (la voix passe par le gateway,
  # pas par cet outil), vision.
  # Gain mesure : 112 139 -> 88 762 B, soit -21 % par requete.
  #
  # NB 1 : bfl et kanban restent actives par defaut malgre leur absence
  #        ici. Le gain supplementaire (~10 Ko) n a pas ete juge rentable.
  # NB 2 : NE PAS utiliser `hermes tools disable` — la commande REECRIT
  #        tout config.yaml et efface les 255 lignes de commentaires.
  #        Editer ce bloc a la main, gateway arrete.
  discord:
    - web            # recherche et extraction
    - terminal       # shell, ouverture de sites
    - file           # lecture / ecriture
    - computer_use   # pilotage du bureau
    - memory         # memoire persistante
    - todo           # taches
    - clarify        # questions de clarification
    - skills         # indispensable en Phase B (google-workspace est une skill)
    - discord        # lecture du salon
    # discord_admin retire le 2026-08-25 : la nouvelle invitation n accorde
